services:
  - type: web
    name: codepath
    runtime: node
    autoDeploy: true
    domains:
      - codepath.ru
    buildCommand: >
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @workspace/learn run build &&
      corepack pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.cjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: APP_BASE_URL
        value: https://codepath.ru
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPPORT_EMAIL_TO
        value: krokodil22009@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: codepath-db
          property: connectionString

databases:
  - name: codepath-db
