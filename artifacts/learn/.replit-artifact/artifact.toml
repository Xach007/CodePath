kind = "web"
previewPath = "/"
title = "CodePath - Programming Learning Platform"
version = "1.0.0"
id = "artifacts/learn"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20579
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/learn run dev"

[services.env]
PORT = "20579"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/learn", "run", "build"]
publicDir = "artifacts/learn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
