<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var useDark = theme !== "light";
          document.documentElement.classList.toggle("dark", useDark);
          document.documentElement.style.colorScheme = useDark ? "dark" : "light";
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #020617;
        color: #f8fafc;
      }

      html:not(.dark),
      html:not(.dark) body,
      html:not(.dark) #root {
        background: #f8fafc;
        color: #0f172a;
      }
    </style>
    <title>CodePath</title>
    <meta name="description" content="Interactive programming learning platform. Master Python, JavaScript, HTML, CSS, SQL, C++ and Java with hands-on courses, quizzes and coding challenges." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CodePath" />
    <meta property="og:description" content="Master the code. Interactive courses, quizzes and coding challenges for 7 programming languages." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodePath" />
    <meta name="twitter:description" content="Master the code. Interactive courses, quizzes and coding challenges for 7 programming languages." />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
